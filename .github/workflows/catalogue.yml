name: Catalogue checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build the static site
        run: |
          npm ci --include=dev
          npm run build
      - name: Type-check the storefront
        run: npm run check
      - name: Check the published catalogue
        run: node --test
